<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Project Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #2d2d44 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #ccc;
        }
        .status-badge {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }
        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
        }
        .info-item span {
            display: block;
            font-size: 0.8rem;
            color: #888;
        }
        .info-item strong {
            font-size: 1.1rem;
            color: #00dbde;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DevOps Mission Control</h1>
        <p>Յուրա Մաղաքյանի նախագիծը հաջողությամբ գործարկվել է</p>
        
        <div class="status-badge">System Online</div>

        <div class="info-grid">
            <div class="info-item">
                <span>Frontend</span>
                <strong>React / Static</strong>
            </div>
            <div class="info-item">
                <span>Backend</span>
                <strong>Node.js Express</strong>
            </div>
            <div class="info-item">
                <span>Database</span>
                <strong>MongoDB</strong>
            </div>
        </div>

        <div style="margin-top: 30px; font-size: 0.9rem; color: #666;">
            Deployment via GitHub Actions • Dockerized Architecture
        </div>
    </div>

</body>
</html>
