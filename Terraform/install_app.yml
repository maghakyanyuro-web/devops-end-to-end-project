---
- hosts: new_servers
  become: yes
  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Run a simple Web Container
      docker_container:
        name: junior-dashboard
        image: nginx:latest
        state: started
        ports:
          - "8080:80"

